name: Update Cloudflared (GoReleaser, cache-based)

on:
    schedule:
        - cron: "9 12 * * *" # 每天 12:09 UTC 检查
    workflow_dispatch:

jobs:
    update-cloudflared-goreleaser:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
            pages: write
            id-token: write
        steps:
            - name: Checkout this repo
              uses: actions/checkout@v4

            - name: Install deps
              run: |
                  sudo apt-get update
                  sudo apt-get install -y jq curl git

            - name: Prepare cache dir
              run: mkdir -p .cache/cloudflared

            - name: Detect latest upstream tag
              id: latest
              run: |
                  TAG=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r .tag_name)
                  if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
                    echo "::error::failed to fetch latest tag"
                    exit 1
                  fi
                  echo "latest_tag=${TAG}" >> $GITHUB_OUTPUT

            - name: Restore cached tag
              id: restore_state
              uses: actions/cache/restore@v4
              with:
                  path: .cache/cloudflared
                  key: cloudflared-state-v1-${{ steps.latest.outputs.latest_tag }}
                  restore-keys: |
                      cloudflared-state-v1-

            - name: Load last tag from cache
              id: previous
              run: |
                  if [ -f .cache/cloudflared/version ]; then
                    LAST=$(cat .cache/cloudflared/version)
                  else
                    LAST="none"
                  fi
                  echo "last_tag=${LAST}" >> $GITHUB_OUTPUT

            - name: Compare tags
              id: compare
              run: |
                  if [ "${{ steps.latest.outputs.latest_tag }}" = "${{ steps.previous.outputs.last_tag }}" ]; then
                    echo "same=true" >> $GITHUB_OUTPUT
                  else
                    echo "same=false" >> $GITHUB_OUTPUT
                  fi

            - name: Early exit if up-to-date
              if: steps.compare.outputs.same == 'true'
              run: echo "Already up to date (cloudflared ${{ steps.latest.outputs.latest_tag }})"

            # 仅在有新版本时继续
            - name: Clone upstream
              if: steps.compare.outputs.same == 'false'
              run: |
                  git clone --depth=1 --branch ${{ steps.latest.outputs.latest_tag }} https://github.com/cloudflare/cloudflared.git

            - name: Apply patch (optional)
              if: steps.compare.outputs.same == 'false'
              run: |
                  cd cloudflared
                  if [ -f ../app/cloudflared/dial.go ]; then
                    cp ../app/cloudflared/dial.go edgediscovery/dial.go
                  else
                    echo "::warning::no patch file found; continue unpatched"
                  fi

            - name: Copy GoReleaser and docker config into upstream tree
              if: steps.compare.outputs.same == 'false'
              run: |
                  cd cloudflared
                  if [ -f ../app/cloudflared/goreleaser.yaml ]; then
                    cp ../app/cloudflared/goreleaser.yaml .goreleaser.yaml
                  else
                    echo "::warning::no goreleaser file found; continue unpatched"
                  fi
                  if [ -f ../app/cloudflared/Dockerfile.amd64 ]; then
                    cp ../app/cloudflared/Dockerfile.amd64 Dockerfile.amd64
                  else
                    echo "::warning::no amd64 dockerfile found; continue unpatched"
                  fi
                  if [ -f ../app/cloudflared/Dockerfile.arm64 ]; then
                    cp ../app/cloudflared/Dockerfile.arm64 Dockerfile.arm64
                  else
                    echo "::warning::no arm64 dockerfile found; continue unpatched"
                  fi

            # - name: Setup Go
            #   if: steps.compare.outputs.same == 'false'
            #   uses: actions/setup-go@v5
            #   with:
            #       go-version: "1.25.0"

            # - name: Run GoReleaser
            #   if: steps.compare.outputs.same == 'false'
            #   uses: goreleaser/goreleaser-action@v5
            #   with:
            #       distribution: goreleaser
            #       version: latest
