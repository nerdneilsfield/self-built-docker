            - name: Set up QEMU
              if: steps.compare.outputs.same == 'false'
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              if: steps.compare.outputs.same == 'false'
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              if: steps.compare.outputs.same == 'false'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push cloudflared image (amd64)
              if: steps.compare.outputs.same == 'false'
              uses: docker/build-push-action@v6
              with:
                  context: ./cloudflared
                  file: ./cloudflared/Dockerfile.amd64
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/cloudflared:amd64-${{ steps.latest.outputs.latest_tag }}
                      ghcr.io/${{ github.repository_owner }}/cloudflared:amd64-latest
                  provenance: false

            - name: Build and push cloudflared image (arm64)
              if: steps.compare.outputs.same == 'false'
              uses: docker/build-push-action@v6
              with:
                  context: ./cloudflared
                  file: ./cloudflared/Dockerfile.arm64
                  push: true
                  platforms: linux/arm64
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/cloudflared:arm64-${{ steps.latest.outputs.latest_tag }}
                      ghcr.io/${{ github.repository_owner }}/cloudflared:arm64-latest
                  provenance: false

            - name: Publish multi-arch manifests
              if: steps.compare.outputs.same == 'false'
              run: |
                  docker buildx imagetools create \
                    -t ghcr.io/${{ github.repository_owner }}/cloudflared:${{ steps.latest.outputs.latest_tag }} \
                    -t ghcr.io/${{ github.repository_owner }}/cloudflared:latest \
                    ghcr.io/${{ github.repository_owner }}/cloudflared:amd64-${{ steps.latest.outputs.latest_tag }} \
                    ghcr.io/${{ github.repository_owner }}/cloudflared:arm64-${{ steps.latest.outputs.latest_tag }}

            - name: Update cached version
              if: steps.compare.outputs.same == 'false'
              run: |
                  echo "${{ steps.latest.outputs.latest_tag }}" > .cache/cloudflared/version

            - name: Save updated cache
              if: steps.compare.outputs.same == 'false' && steps.restore_state.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: .cache/cloudflared
                  key: cloudflared-state-v1-${{ steps.latest.outputs.latest_tag }}

            # ====== Telegram 通知 ======
            - name: Telegram Notification - updated
              if: steps.compare.outputs.same == 'false'
              uses: nerdneilsfield/action-simple-telegram-notification-bot@master
              with:
                  text: "✅ Cloudflared updated to ${{ steps.latest.outputs.latest_tag }} 🎉"
              env:
                  BOT_URL: ${{ secrets.BOT_URL }}
                  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

            - name: Telegram Notification - no update
              if: steps.compare.outputs.same == 'true'
              uses: nerdneilsfield/action-simple-telegram-notification-bot@master
              with:
                  text: "ℹ️ Cloudflared has no updates. Latest: ${{ steps.latest.outputs.latest_tag }}"
                  push_success: false
              env:
                  BOT_URL: ${{ secrets.BOT_URL }}
                  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

            # 自动设置 BUILD_TIME（格式与官方 Makefile 类似：%Y-%m-%d-%H%M UTC）
