name: Update for caddy (dockerhub-based, stable)

on:
  schedule:
    - cron: "5 12 * * *" # 每天 12:05 UTC 检查
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-caddy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/caddy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl

      - name: Detect latest upstream caddy tag
        id: latest
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/caddyserver/caddy/releases/latest | jq -r .tag_name)

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error title=Failed::Unable to detect latest Caddy release tag."
            exit 1
          fi

          echo "latest_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Detected latest upstream tag: ${TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether tag already exists on Docker Hub
        id: check_image
        run: |
          TARGET_IMAGE="${IMAGE_NAME}:${{ steps.latest.outputs.latest_tag }}"

          echo "Checking Docker Hub for: ${TARGET_IMAGE}"

          if docker manifest inspect "${TARGET_IMAGE}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skip::Image already exists on Docker Hub: ${TARGET_IMAGE}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist yet on Docker Hub: ${TARGET_IMAGE}"
          fi

      - name: Early exit notice if image already exists
        if: steps.check_image.outputs.exists == 'true'
        run: |
          echo "::notice title=Up-to-date::Docker Hub already has Caddy ${{ steps.latest.outputs.latest_tag }}"

      - name: Build and push Caddy image (multi-arch)
        if: steps.check_image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./app/caddy
          file: ./app/caddy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            CADDY_UPSTREAM_TAG=${{ steps.latest.outputs.latest_tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.latest.outputs.latest_tag }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: false

      # ====== 发布到 GitHub Pages 的 /caddy 子目录 ======
      - name: Prepare /caddy directory for Pages
        if: steps.check_image.outputs.exists == 'false'
        run: |
          BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          VERSION="${{ steps.latest.outputs.latest_tag }}"
          IMAGE_VERSIONED="${IMAGE_NAME}:${VERSION}"
          IMAGE_LATEST="${IMAGE_NAME}:latest"

          mkdir -p "public/caddy/downloads/${VERSION}"

          echo "${VERSION}" > "public/caddy/downloads/${VERSION}/VERSION"
          echo "${IMAGE_VERSIONED}" > "public/caddy/downloads/${VERSION}/IMAGE"
          echo "${BUILD_TIME}" > "public/caddy/downloads/${VERSION}/BUILD_TIME"

          # 生成该版本页
          cat > "public/caddy/downloads/${VERSION}/index.html" <<EOF
          <html><body style="font-family:sans-serif;max-width:720px;margin:2em auto;">
          <h2>Caddy Build: ${VERSION}</h2>
          <p><b>Docker Image:</b> <code>${IMAGE_VERSIONED}</code></p>
          <p><b>Build Time:</b> ${BUILD_TIME}</p>
          <p><a href="../latest/">Latest Build →</a></p>
          <hr>
          <p style="color:gray;font-size:0.85em;">Built at ${BUILD_TIME}</p>
          </body></html>
          EOF

          # 同步 latest
          rm -rf public/caddy/downloads/latest || true
          mkdir -p public/caddy/downloads/latest
          cp -r "public/caddy/downloads/${VERSION}/"* public/caddy/downloads/latest/

          # 生成顶层 /caddy/index.html
          cat > public/caddy/index.html <<EOF
          <html><body style="font-family:sans-serif;max-width:720px;margin:2em auto;">
          <h1>🦄 Caddy Auto Build Dashboard</h1>
          <p><b>Latest version:</b> ${VERSION}</p>
          <p><b>Docker image:</b> <code>${IMAGE_LATEST}</code></p>
          <p><b>Build time:</b> ${BUILD_TIME}</p>
          <p><a href="./downloads/latest/">Browse latest build files</a></p>
          <hr>
          <p style="color:gray;font-size:0.85em;">Last updated: ${BUILD_TIME}</p>
          </body></html>
          EOF

      - name: Upload artifact for Pages
        if: steps.check_image.outputs.exists == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.check_image.outputs.exists == 'false'
        uses: actions/deploy-pages@v4

      # ====== Telegram 通知 ======
      - name: Telegram Notification - updated
        if: steps.check_image.outputs.exists == 'false'
        uses: nerdneilsfield/action-simple-telegram-notification-bot@master
        with:
          text: "✅ Caddy updated to ${{ steps.latest.outputs.latest_tag }} and pushed to Docker Hub 🎉"
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Telegram Notification - no update
        if: steps.check_image.outputs.exists == 'true'
        uses: nerdneilsfield/action-simple-telegram-notification-bot@master
        with:
          text: "ℹ️ Caddy has no updates on Docker Hub. Latest: ${{ steps.latest.outputs.latest_tag }}"
          push_success: false
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
