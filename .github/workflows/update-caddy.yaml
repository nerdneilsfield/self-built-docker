name: Update for caddy (cache-based)

on:
    schedule:
        - cron: "5 12 * * *" # 每天 12:05 UTC 检查
    workflow_dispatch:

jobs:
    update-caddy:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
            pages: write
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: master
                  fetch-depth: 0

            - name: Install dependencies
              run: |
                  sudo apt-get update -y
                  sudo apt-get install -y jq curl

            - name: Prepare cache dir
              run: mkdir -p .cache/caddy

            - name: Restore version state (actions/cache)
              id: restore-cache
              uses: actions/cache@v4
              with:
                  path: .cache/caddy
                  key: caddy-state-v1

            - name: Detect latest upstream caddy tag
              id: latest
              run: |
                  TAG=$(curl -s https://api.github.com/repos/caddyserver/caddy/releases/latest | jq -r .tag_name)
                  echo "latest_tag=${TAG}" >> $GITHUB_OUTPUT

            - name: Load last built tag from cache
              id: previous
              run: |
                  if [ -f .cache/caddy/version ]; then
                    LAST=$(cat .cache/caddy/version)
                  else
                    LAST="none"
                  fi
                  echo "last_tag=${LAST}" >> $GITHUB_OUTPUT

            - name: Compare tags
              id: compare
              run: |
                  if [ "${{ steps.latest.outputs.latest_tag }}" = "${{ steps.previous.outputs.last_tag }}" ]; then
                    echo "same=true" >> $GITHUB_OUTPUT
                  else
                    echo "same=false" >> $GITHUB_OUTPUT
                  fi

            - name: Early exit if up-to-date
              if: steps.compare.outputs.same == 'true'
              run: echo "::notice title=Skip::Caddy is up to date."

            # ====== 仅在有新版本时执行以下步骤 ======
            - name: Set up QEMU
              if: steps.compare.outputs.same == 'false'
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              if: steps.compare.outputs.same == 'false'
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              if: steps.compare.outputs.same == 'false'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Caddy image (multi-arch)
              if: steps.compare.outputs.same == 'false'
              uses: docker/build-push-action@v6
              with:
                  context: ./app/caddy
                  file: ./app/caddy/Dockerfile
                  push: true
                  platforms: linux/amd64,linux/arm64
                  build-args: |
                      CADDY_UPSTREAM_TAG=${{ steps.latest.outputs.latest_tag }}
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/caddy:${{ steps.latest.outputs.latest_tag }}
                      ghcr.io/${{ github.repository_owner }}/caddy:latest
                  provenance: false

            - name: Update cached version
              if: steps.compare.outputs.same == 'false'
              run: echo "${{ steps.latest.outputs.latest_tag }}" > .cache/caddy/version

            # ====== 发布到 GitHub Pages 的 /caddy 子目录 ======
            - name: Prepare /caddy directory for Pages
              if: steps.compare.outputs.same == 'false'
              run: |
                  mkdir -p public/caddy/downloads/${{ steps.latest.outputs.latest_tag }}
                  echo "${{ steps.latest.outputs.latest_tag }}" > public/caddy/downloads/${{ steps.latest.outputs.latest_tag }}/VERSION
                  echo "ghcr.io/${{ github.repository_owner }}/caddy:${{ steps.latest.outputs.latest_tag }}" > public/caddy/downloads/${{ steps.latest.outputs.latest_tag }}/IMAGE

                  # 生成该版本页
                  cat > public/caddy/downloads/${{ steps.latest.outputs.latest_tag }}/index.html <<EOF
                  <html><body style="font-family:sans-serif">
                  <h2>Caddy Build: ${{ steps.latest.outputs.latest_tag }}</h2>
                  <p>Docker Image: <code>ghcr.io/${{ github.repository_owner }}/caddy:${{ steps.latest.outputs.latest_tag }}</code></p>
                  <p><a href="../latest/">Latest Build →</a></p>
                  </body></html>
                  EOF

                  # 同步 latest
                  rm -rf public/caddy/downloads/latest || true
                  mkdir -p public/caddy/downloads/latest
                  cp -r public/caddy/downloads/${{ steps.latest.outputs.latest_tag }}/* public/caddy/downloads/latest/

                  # 生成顶层 /caddy/index.html
                  cat > public/caddy/index.html <<EOF
                  <html><body style="font-family:sans-serif;max-width:720px;margin:2em auto;">
                  <h1>🦄 Caddy Auto Build Dashboard</h1>
                  <p><b>Latest version:</b> ${{ steps.latest.outputs.latest_tag }}</p>
                  <p><b>Docker image:</b> <code>ghcr.io/${{ github.repository_owner }}/caddy:latest</code></p>
                  <p><a href="./downloads/latest/">Browse latest build files</a></p>
                  <hr>
                  <p style="color:gray;font-size:0.9em;">Updated at $(date -u +'%Y-%m-%d %H:%M UTC')</p>
                  </body></html>
                  EOF

            - name: Upload artifact for Pages
              if: steps.compare.outputs.same == 'false'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: public

            - name: Deploy to GitHub Pages
              if: steps.compare.outputs.same == 'false'
              uses: actions/deploy-pages@v4

            # ====== Telegram 通知 ======
            - name: Telegram Notification - updated
              if: steps.compare.outputs.same == 'false'
              uses: nerdneilsfield/action-simple-telegram-notification-bot@master
              with:
                  text: "✅ Caddy updated to ${{ steps.latest.outputs.latest_tag }} 🎉"
              env:
                  BOT_URL: ${{ secrets.BOT_URL }}
                  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

            - name: Telegram Notification - no update
              if: steps.compare.outputs.same == 'true'
              uses: nerdneilsfield/action-simple-telegram-notification-bot@master
              with:
                  text: "ℹ️ Caddy has no updates. Latest: ${{ steps.latest.outputs.latest_tag }}"
                  push_success: false
              env:
                  BOT_URL: ${{ secrets.BOT_URL }}
                  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
